# Central telefonica (internos). Va aparte: no toca ni dev ni prod.
# Levantar:  docker compose -f telefonia/docker-compose.yml --env-file .env up --build -d
name: aiml-telefonia
services:
  central:
    build: .
    container_name: aiml-central-telefonica
    network_mode: host          # la voz (RTP) necesita puertos directos
    environment:
      - TEL_101_PASS=${TEL_101_PASS}
      - TEL_102_PASS=${TEL_102_PASS}
      - TEL_103_PASS=${TEL_103_PASS}
      - TEL_SECRET=${TEL_SECRET}
      - IP_PUBLICA=${TEL_IP_PUBLICA:-179.43.123.134}
    volumes:
      - central_db:/var/lib/asterisk-db   # recuerda los internos conectados si se reinicia
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  central_db:
