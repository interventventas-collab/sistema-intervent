; ===== Central de internos =====
; 101 = telefono Grandstream de la oficina
; 102 = notebook (app Linphone o, mas adelante, la pantalla Telefono del sistema)

[global]
type = global
user_agent = Central
endpoint_identifier_order = username,ip

[udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

[tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

; puerta alternativa: algunas empresas de internet bloquean la 5060
[udp-alt]
type = transport
protocol = udp
bind = 0.0.0.0:15060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

[tcp-alt]
type = transport
protocol = tcp
bind = 0.0.0.0:15060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

; ---- plantillas ----
[interno-ep](!)
type = endpoint
context = internos
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
dtmf_mode = rfc4733

[interno-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

; ---- 101 ----
[101](interno-ep)
auth = 101-auth
aors = 101
callerid = "Oficina" <101>
[101-auth]
type = auth
auth_type = userpass
username = 101
password = __TEL_101_PASS__
[101](interno-aor)

; ---- 102 ----
[102](interno-ep)
auth = 102-auth
aors = 102
callerid = "Notebook" <102>
[102-auth]
type = auth
auth_type = userpass
username = 102
password = __TEL_102_PASS__
[102](interno-aor)
