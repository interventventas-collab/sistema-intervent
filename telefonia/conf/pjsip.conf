; ===== Central de internos =====
; 101 = telefono Grandstream de la oficina
; 102 = notebook (app Linphone o, mas adelante, la pantalla Telefono del sistema)

[global]
type = global
user_agent = Central
endpoint_identifier_order = username,ip

[udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

[tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

; puerta alternativa: algunas empresas de internet bloquean la 5060
[udp-alt]
type = transport
protocol = udp
bind = 0.0.0.0:15060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

[tcp-alt]
type = transport
protocol = tcp
bind = 0.0.0.0:15060
external_media_address = __IP_PUBLICA__
external_signaling_address = __IP_PUBLICA__

; telefono dentro del sistema (navegador). La entrada segura (HTTPS) la pone Caddy.
[ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ---- plantillas ----
[interno-ep](!)
type = endpoint
context = internos
disallow = all
allow = ulaw,alaw,g722
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = no
dtmf_mode = rfc4733

[interno-aor](!)
type = aor
max_contacts = 2
remove_existing = yes
qualify_frequency = 30

; ---- 101 ----
[101](interno-ep)
auth = 101-auth
aors = 101
callerid = "Oficina" <101>
[101-auth]
type = auth
auth_type = userpass
username = 101
password = __TEL_101_PASS__
[101](interno-aor)

; ---- 102 ----
[102](interno-ep)
auth = 102-auth
aors = 102
callerid = "Notebook" <102>
[102-auth]
type = auth
auth_type = userpass
username = 102
password = __TEL_102_PASS__
[102](interno-aor)

; ---- telefono dentro del sistema (navegador, WebRTC) ----
; endpoint aparte del Grandstream: el navegador necesita ICE y cifrado (ver 101).
; Claves: se calculan de TEL_SECRET (arrancar.sh y Api/Controllers/TelefonoController.cs).
[web-ep](!,interno-ep)
webrtc = yes
ice_support = yes
allow = !all,ulaw,alaw

[web-aor](!,interno-aor)
max_contacts = 10

[201](web-ep)
auth = 201-auth
aors = 201
callerid = "Osmar" <201>
[201-auth]
type = auth
auth_type = userpass
username = 201
password = __PASS_201__
[201](web-aor)

[202](web-ep)
auth = 202-auth
aors = 202
callerid = "German" <202>
[202-auth]
type = auth
auth_type = userpass
username = 202
password = __PASS_202__
[202](web-aor)

[203](web-ep)
auth = 203-auth
aors = 203
callerid = "Gabriel" <203>
[203-auth]
type = auth
auth_type = userpass
username = 203
password = __PASS_203__
[203](web-aor)

; 210 = compus del deposito (todas a la vez). 211-215 suenan aca con el nombre de a quien buscan.
[210](web-ep)
auth = 210-auth
aors = 210
callerid = "Deposito" <210>
[210-auth]
type = auth
auth_type = userpass
username = 210
password = __PASS_210__
[210](web-aor)

; 103 = version vieja del telefono en el sistema (un solo interno). Se borra cuando
; produccion use los internos por persona (201-203, 210).
[103](web-ep)
auth = 103-auth
aors = 103
callerid = "Sistema" <103>
[103-auth]
type = auth
auth_type = userpass
username = 103
password = __TEL_103_PASS__
[103](web-aor)
