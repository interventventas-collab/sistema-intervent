[general]
static = yes
writeprotect = yes

; Sin linea de afuera: solo se puede llamar entre internos.
; Toda llamada entra por aca: anota el destino y, al cortar, le avisa al sistema
; (registro de llamadas / perdidas) con el hangup handler [registrar].
[internos]
exten => _X.,1,Set(DESTINO=${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=registrar,s,1)
 same => n,Goto(destinos,${EXTEN},1)

[destinos]
exten => 101,1,Dial(PJSIP/101,40)
 same => n,Hangup()
exten => 102,1,Dial(PJSIP/102,40)
 same => n,Hangup()
exten => 103,1,Dial(PJSIP/103,40)
 same => n,Hangup()
; personas de la oficina: suena en todas las compus donde estan conectados
exten => _20[1-3],1,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" = ""]?nadie)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},40)
 same => n,Hangup()
 same => n(nadie),Set(DIALSTATUS=NOCONTACT)
 same => n,Hangup(20)
; 200 = la oficina (todos): fijo + Osmar + German + Gabriel, atiende el primero
exten => 200,1,Set(D=)
 same => n,ExecIf($["${PJSIP_DIAL_CONTACTS(101)}" != ""]?Set(D=${D}&${PJSIP_DIAL_CONTACTS(101)}))
 same => n,ExecIf($["${PJSIP_DIAL_CONTACTS(201)}" != ""]?Set(D=${D}&${PJSIP_DIAL_CONTACTS(201)}))
 same => n,ExecIf($["${PJSIP_DIAL_CONTACTS(202)}" != ""]?Set(D=${D}&${PJSIP_DIAL_CONTACTS(202)}))
 same => n,ExecIf($["${PJSIP_DIAL_CONTACTS(203)}" != ""]?Set(D=${D}&${PJSIP_DIAL_CONTACTS(203)}))
 same => n,GotoIf($["${D}" = ""]?nadie)
 same => n,Dial(${D:1},40)
 same => n,Hangup()
 same => n(nadie),Set(DIALSTATUS=NOCONTACT)
 same => n,Hangup(20)
; deposito: 210 = cualquiera, 211-215 = buscan a alguien (sale en el cartel)
exten => 210,1,Set(_BUSCA=)
 same => n,Goto(deposito,s,1)
exten => 211,1,Set(_BUSCA=ALEXIS)
 same => n,Goto(deposito,s,1)
exten => 212,1,Set(_BUSCA=WALTER)
 same => n,Goto(deposito,s,1)
exten => 213,1,Set(_BUSCA=RODRIGO)
 same => n,Goto(deposito,s,1)
exten => 214,1,Set(_BUSCA=BENJAMIN)
 same => n,Goto(deposito,s,1)
exten => 215,1,Set(_BUSCA=GONZALO)
 same => n,Goto(deposito,s,1)
; 600 = prueba de eco: lo que decis te vuelve (para probar microfono y parlante)
; 230 = tablet del tostadero
exten => 230,1,GotoIf($["${PJSIP_DIAL_CONTACTS(230)}" = ""]?nadie)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(230)},40)
 same => n,Hangup()
 same => n(nadie),Set(DIALSTATUS=NOCONTACT)
 same => n,Hangup(20)

exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; suena en todas las compus del deposito; el nombre de a quien buscan viaja en el header X-Busca
[deposito]
exten => s,1,GotoIf($["${PJSIP_DIAL_CONTACTS(210)}" = ""]?nadie)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(210)},40,b(poner-busca^s^1))
 same => n,Hangup()
 same => n(nadie),Set(DIALSTATUS=NOCONTACT)
 same => n,Hangup(20)

[poner-busca]
exten => s,1,ExecIf($["${BUSCA}" != ""]?Set(PJSIP_HEADER(add,X-Busca)=${BUSCA}))
 same => n,Return()

; repartidores (celu): solo pueden llamar a la oficina (200) o al fijo (101)
[repartidor]
exten => _20[0-3],1,Goto(internos,${EXTEN},1)
exten => 101,1,Goto(internos,101,1)
exten => 210,1,Goto(internos,210,1)

; al cortar cualquier llamada: le cuenta al sistema quien llamo a quien y como termino
; (dev por el puerto 3000 local y prod por el dominio). Clave en el header X-Central-Key.
[registrar]
exten => s,1,Set(CURLOPT(httpheader)=X-Central-Key: __PASS_CENTRAL__)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(DATOS=de=${CALLERID(num)}&nombre=${URIENCODE(${CALLERID(name)})}&a=${DESTINO}&busca=${BUSCA}&estado=${DIALSTATUS}&segundos=${ANSWEREDTIME})
 same => n,Set(R=${CURL(http://127.0.0.1:3000/api/telefono/registro,${DATOS})})
 same => n,Set(R=${CURL(https://__DOMINIO__/api/telefono/registro,${DATOS})})
 same => n,Return()

; mensajes programados: el sistema llama (ARI) y al atender lee el texto en voz alta, dos veces.
; El texto llega en base64 (TEXTOB64) para que no se pueda meter nada raro en el comando.
[mensaje]
exten => s,1,Set(F=/tmp/msg-${FILTER(0-9,${UNIQUEID})})
 same => n,System(echo '${FILTER(A-Za-z0-9+/=,${TEXTOB64})}' | base64 -d | espeak-ng -v es-419 -s 140 -p 45 --stdin -w ${F}.wav && sox ${F}.wav -r 8000 -c 1 -t ul ${F}.ulaw)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${F})
 same => n,Wait(1)
 same => n,Playback(${F})
 same => n,Set(CURLOPT(httpheader)=X-Central-Key: __PASS_CENTRAL__)
 same => n,Set(R=${CURL(http://127.0.0.1:3000/api/telefono/mensaje-escuchado,id=${MSGID}&a=${MSGA})})
 same => n,Set(R=${CURL(https://__DOMINIO__/api/telefono/mensaje-escuchado,id=${MSGID}&a=${MSGA})})
 same => n,Hangup()
exten => h,1,System(rm -f ${F}.wav ${F}.ulaw)
