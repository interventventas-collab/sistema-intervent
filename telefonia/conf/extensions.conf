[general]
static = yes
writeprotect = yes

; Sin linea de afuera: solo se puede llamar entre internos.
[internos]
exten => 101,1,Dial(PJSIP/101,40)
 same => n,Hangup()
exten => 102,1,Dial(PJSIP/102,40)
 same => n,Hangup()
exten => 103,1,Dial(PJSIP/103,40)
 same => n,Hangup()
; personas de la oficina y deposito: suena en todas las compus donde estan conectados
exten => _20[1-3],1,GotoIf($["${PJSIP_DIAL_CONTACTS(${EXTEN})}" = ""]?nadie)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(${EXTEN})},40)
 same => n,Hangup()
 same => n(nadie),Hangup(20)
exten => 210,1,Set(_BUSCA=)
 same => n,Goto(deposito,s,1)
exten => 211,1,Set(_BUSCA=ALEXIS)
 same => n,Goto(deposito,s,1)
exten => 212,1,Set(_BUSCA=WALTER)
 same => n,Goto(deposito,s,1)
exten => 213,1,Set(_BUSCA=RODRIGO)
 same => n,Goto(deposito,s,1)
exten => 214,1,Set(_BUSCA=BENJAMIN)
 same => n,Goto(deposito,s,1)
exten => 215,1,Set(_BUSCA=GONZALO)
 same => n,Goto(deposito,s,1)
; 600 = prueba de eco: lo que decis te vuelve (para probar microfono y parlante)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; suena en todas las compus del deposito; el nombre de a quien buscan viaja en el header X-Busca
[deposito]
exten => s,1,GotoIf($["${PJSIP_DIAL_CONTACTS(210)}" = ""]?nadie)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(210)},40,b(poner-busca^s^1))
 same => n,Hangup()
 same => n(nadie),Hangup(20)

[poner-busca]
exten => s,1,ExecIf($["${BUSCA}" != ""]?Set(PJSIP_HEADER(add,X-Busca)=${BUSCA}))
 same => n,Return()
