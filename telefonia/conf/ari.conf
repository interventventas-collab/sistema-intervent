; ARI: la API del sistema pregunta quien esta conectado (GET /ari/endpoints/PJSIP)
; y origina las llamadas de los mensajes programados (POST /ari/channels).
; Solo escucha en la red interna (http.conf). Clave calculada de TEL_SECRET.
[general]
enabled = yes
[sistema]
type = user
read_only = no
password = __PASS_ARI__
