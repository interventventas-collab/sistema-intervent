services:
  # --- Fix de permisos del volume de backups (mssql corre como UID 10001) ---
  backups-init-prod:
    image: alpine:3
    container_name: aiml-backups-init-prod
    command: sh -c "mkdir -p /backup && chown -R 10001:10001 /backup && chmod 770 /backup"
    volumes:
      - backups_prod_data:/backup
    restart: "no"

  # --- Base de datos PRODUCCION ---
  sqlserver-prod:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aiml-sqlserver-prod
    depends_on:
      backups-init-prod:
        condition: service_completed_successfully
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD no definido en .env}
      - MSSQL_PID=Express
    volumes:
      - sqlserver_prod_data:/var/opt/mssql
      - backups_prod_data:/var/opt/mssql/backup
    networks:
      - aiml-prod-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --- Inicializacion de la DB PRODUCCION ---
  sqlserver-init-prod:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aiml-sqlserver-init-prod
    depends_on:
      sqlserver-prod:
        condition: service_healthy
    environment:
      - SA_PASSWORD=${SQL_SA_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql
    networks:
      - aiml-prod-net
    entrypoint: ["sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver-prod -U sa -P \"$$SA_PASSWORD\" -C -I -i /init.sql"]
    restart: "no"

  # --- Backend API PRODUCCION ---
  api-prod:
    build:
      context: ./src/Api
      dockerfile: Dockerfile
    container_name: aiml-api-prod
    environment:
      # 2026-06-22: Zona horaria forzada a Argentina. El usuario opera el negocio desde
      # España pero el negocio esta en Argentina — todas las fechas/horas generadas en el
      # servidor (PDFs, recibos, logs) deben mostrar hora ARG, no UTC ni Europe/Madrid.
      - TZ=America/Argentina/Buenos_Aires
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver-prod;Database=AIml;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET no definido en .env}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - VAULT_DEFAULT_PASSWORD=${VAULT_DEFAULT_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PLAYWRIGHT_URL=http://playwright-prod:3001
      # Origenes permitidos para CORS en produccion (lista separada por coma).
      # Ej: CORS_ALLOWED_ORIGINS=https://midominio.com
      # Si esta vacio, CORS queda cerrado y solo funcionan los requests del mismo
      # origen (a traves del reverse proxy Caddy), que es el caso normal.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      # WhatsApp Cloud API oficial de Meta (alternativa a Twilio, sin intermediario).
      - META_WA_TOKEN=${META_WA_TOKEN:-}
      - META_WA_PHONE_ID=${META_WA_PHONE_ID:-}
      - META_WA_WABA_ID=${META_WA_WABA_ID:-}
      - META_WA_VERIFY_TOKEN=${META_WA_VERIFY_TOKEN:-}
      # WhatsApp LLAMADAS de voz (softphone WebRTC en /llamadas). Apagado hasta terminar la puesta
      # en marcha. TURN_* apuntan al servidor de audio (servicio "coturn", perfil "turn").
      - WA_LLAMADAS_ENABLED=${WA_LLAMADAS_ENABLED:-}
      - TURN_URL=${TURN_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Instagram DM (Messages API oficial de Meta). Una terna ID/TOKEN por cuenta de IG.
      # El webhook de IG usa el MISMO verify token que WhatsApp (META_WA_VERIFY_TOKEN).
      - META_IG_FRIKAF_CAFE_ID=${META_IG_FRIKAF_CAFE_ID:-}
      - META_IG_FRIKAF_CAFE_TOKEN=${META_IG_FRIKAF_CAFE_TOKEN:-}
      - META_IG_INTERVENT_FRIKAF_ID=${META_IG_INTERVENT_FRIKAF_ID:-}
      - META_IG_INTERVENT_FRIKAF_TOKEN=${META_IG_INTERVENT_FRIKAF_TOKEN:-}
      - META_IG_ALQUILERES_ID=${META_IG_ALQUILERES_ID:-}
      - META_IG_ALQUILERES_TOKEN=${META_IG_ALQUILERES_TOKEN:-}
      # Google Maps Platform (Routes API) para optimizar el orden de las rutas de reparto.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Clave del navegador para dibujar el mapa (Maps JavaScript API, restringida por dominio).
      - GOOGLE_MAPS_BROWSER_KEY=${GOOGLE_MAPS_BROWSER_KEY:-}
    volumes:
      - files_prod_data:/data/files
      - backups_prod_data:/data/backups
      - preventas_fotos_prod:/data/preventas-fotos
      - wa_uploads_prod:/data/whatsapp-uploads
      - ./caddy/static/frikaf:/srv/landing-frikaf
    networks:
      - aiml-prod-net
    depends_on:
      sqlserver-prod:
        condition: service_healthy
    # 2026-08-15: "esta lista la API?". Le pega a si misma por HTTP; Kestrel recien escucha el
    # puerto cuando la app termino de arrancar, asi que si contesta HTTP es que ya esta sirviendo.
    # Lo usa web-prod para NO arrancar antes de tiempo (era la causa de los 502 al publicar).
    # OJO: la imagen de la API no trae curl ni wget, por eso se usa bash (/dev/tcp). NO cambiar a
    # "sh": el sh de Debian (dash) no soporta /dev/tcp y el chequeo fallaria siempre.
    # 2026-08-15 (2da pasada): el margen de arranque era corto. La API hace bastante trabajo ANTES
    # de abrir el puerto 80, y en una publicacion con el servidor cargado tardo mas de lo permitido:
    # Docker la dio por fallada, la reinicio, y web-prod (que espera a que este sana) nunca arranco
    # -> produccion caida varios minutos. Con start_period 120s el arranque lento ya no cuenta como
    # falla, y aunque despues tarde, hay 20 reintentos x 10s de colchon.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'HEAD / HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q HTTP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # --- Playwright PRODUCCION ---
  playwright-prod:
    build:
      context: ./src/Playwright
      dockerfile: Dockerfile
    container_name: aiml-playwright-prod
    environment:
      - NODE_ENV=production
    volumes:
      - playwright_prod_data:/data
    networks:
      - aiml-prod-net
    restart: unless-stopped

  # --- Frontend PRODUCCION ---
  web-prod:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
    container_name: aiml-web-prod
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # App del amigo electricista (C.S.E) — archivo estatico autonomo servido en /electricista
      - ./presupuestos-electricista/sistema-cse.html:/usr/share/nginx/html/electricista/index.html:ro
      - ./presupuestos-electricista/armador-presupuestos-cse.html:/usr/share/nginx/html/electricista/armador.html:ro
    networks:
      - aiml-prod-net
    # 2026-08-15: espera a que la API este RESPONDIENDO (no solo "arrancada"). Antes con un
    # depends_on pelado el web levantaba primero y los usuarios veian 502 durante la publicacion.
    depends_on:
      api-prod:
        condition: service_healthy
    restart: unless-stopped

  # --- App del amigo electricista (C.S.E): backend propio + SQLite, separado de INTER VENT ---
  electri-api:
    build:
      context: ./electricista-nube/Api
      dockerfile: Dockerfile
    container_name: aiml-electri-prod
    expose:
      - "8080"
    environment:
      - DB_PATH=/data/electricista.db
    volumes:
      - electri_prod_data:/data
    networks:
      - aiml-prod-net
    restart: unless-stopped

  # --- Caddy (reverse proxy + HTTPS automatico) ---
  # Si DOMAIN esta definido -> pide certificado real a Let's Encrypt.
  # Si DOMAIN esta vacio      -> sirve por IP con certificado autofirmado (tls internal).
  caddy:
    image: caddy:2-alpine
    container_name: aiml-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Defaults aplicados aca (no en el Caddyfile) porque Caddy v2 solo aplica
      # el default {$VAR:default} si la variable NO esta seteada. Si la env
      # esta seteada pero vacia (caso tipico de .env con DOMAIN= vacio),
      # el reemplazo es "" y rompe el parser del Caddyfile.
      # Default a "localhost": Caddy emite cert interno para localhost sin
      # contactar Let's Encrypt, asi que cuando el cliente no configura un
      # dominio real, el bloque queda dormido (nadie pide localhost en prod)
      # y el catch-all :443 con tls internal sirve a todos los requests por IP.
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-noreply@example.com}
      # PUBLIC_IP: misma logica que DOMAIN. Si el cliente la deja vacia en
      # .env, defaulteamos a 127.0.0.1 (siempre apunta al loopback de la
      # maquina, no expone nada extra). El Caddyfile genera un bloque
      # "https://{$PUBLIC_IP}" con cert interno y un default_sni que apunta
      # a esa IP, lo que permite que el browser entrando por IP literal
      # (sin SNI) reciba el cert correcto en vez de un handshake roto.
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aiml-prod-net
    depends_on:
      - web-prod
    restart: unless-stopped

  # --- Servidor de audio TURN/STUN para las LLAMADAS de WhatsApp (WebRTC) ---
  # IMPORTANTE: NO arranca en la publicacion normal. Solo se enciende a proposito con:
  #   docker compose -f docker-compose.prod.yml --profile turn up -d coturn
  # (gracias a "profiles: [turn]"). Asi una publicacion comun nunca lo prende sin querer.
  #
  # Requisitos para que funcione (se hacen el dia de la puesta en marcha):
  #   1. TURN_EXTERNAL_IP en el .env = IP publica del servidor de DonWeb.
  #   2. TURN_USERNAME y TURN_CREDENTIAL en el .env (usuario/clave que elijas).
  #   3. Abrir en el firewall de DonWeb: 3478/udp, 3478/tcp y el rango 49160-49200/udp.
  #   4. En el .env de la API: TURN_URL=turn:LA_IP_PUBLICA:3478 (mismos user/credential).
  coturn:
    image: coturn/coturn:4.6
    container_name: aiml-coturn-prod
    profiles: ["turn"]
    network_mode: host
    restart: unless-stopped
    command:
      - -n
      - --realm=frikaf
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-frikaf}:${TURN_CREDENTIAL:-cambiar-esta-clave}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-cli
      - --no-tls
      - --no-dtls

networks:
  aiml-prod-net:
    driver: bridge

volumes:
  sqlserver_prod_data:
  playwright_prod_data:
  files_prod_data:
  backups_prod_data:
  preventas_fotos_prod:
  wa_uploads_prod:
  caddy_data:
  caddy_config:
  electri_prod_data:
